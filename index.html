    <script>
      // Safeguard against "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var customFetch = originalFetch;

          // Define setter on window
          if (typeof window !== 'undefined') {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return customFetch || (originalFetch ? originalFetch : undefined);
              },
              set: function(val) {
                customFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }

          // Also patch Window.prototype if present
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && !protoDesc.set && protoDesc.configurable) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return customFetch || (originalFetch ? originalFetch : undefined);
                },
                set: function(val) {
                  customFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          // Fallback silently
        }
      })();

      // Prevent white flash on page reload if dark mode is active
      (function() {
        try {
          var saved = localStorage.getItem('inktella_theme_v2');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark) || (saved === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
